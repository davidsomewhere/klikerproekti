<!DOCTYPE html>
<html>
<head>
    <title>Forma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form id="myForm">
        <h2>CONTACT FORM</h2>

        <label>Ime:</label>
        <input type="text" id="ime" placeholder="IME" required>

        <label>Telefon:</label>
        <input type="text" id="telefon" placeholder="TELEFON" required>

        <label>Email:</label>
        <input type="email" id="email" placeholder="EMAIL" required>

        <label>Poraka:</label>
        <textarea id="poraka" placeholder="PORAKA" required></textarea>

        <button type="submit">SUBMIT</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
